# User-scope environment for Windows. %VAR% references are expanded when the
# values are applied. Editing this file re-runs the script that applies it.
environment:
  windows:
    variables:
      XDG_CONFIG_HOME: '%USERPROFILE%\.config'
      EDITOR: 'nvim'
    paths:
      - '%USERPROFILE%\bin'
      - '%USERPROFILE%\quick-cmds'
